<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai des dés — Jeu de rôle accessible</title>
<style>
  :root { --fond: #000; --encre: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1rem;
    background: var(--fond);
    color: var(--encre);
    font-family: Verdana, "DejaVu Sans", system-ui, sans-serif;
    font-size: 1.2rem;
    line-height: 1.5;
    max-width: 40rem;
    margin-inline: auto;
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.4rem; }
  .discret { font-size: 1rem; margin: 0 0 0.8rem; }
  a { color: var(--encre); }
  button {
    font: inherit;
    font-weight: bold;
    color: var(--encre);
    background: var(--fond);
    border: 4px solid var(--encre);
    border-radius: 0;
    min-height: 3.5rem;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
  }
  button:focus { outline: 4px dashed var(--encre); outline-offset: 3px; }
  button:disabled { opacity: 0.5; }
  .boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin: 0.8rem 0; }

  /* Le tapis de jeu : la perspective vient d'un peu au-dessus, pour voir le dessus des dés. */
  #tapis {
    position: relative;
    height: 18rem;
    border: 3px solid var(--encre);
    overflow: hidden;
    perspective: 700px;
    perspective-origin: 50% -30%;
  }
  .emplacement { position: absolute; left: 0; top: 0; transform-style: preserve-3d; will-change: transform; }
  .ombre {
    position: absolute; left: 0; top: 0;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
    will-change: transform, opacity;
  }
  .de { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .face {
    position: absolute; left: 0; top: 0;
    background: linear-gradient(145deg, #fff 55%, #d6d6d6);
    border: 2px solid #000;
    border-radius: 14%;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 12%;
    backface-visibility: hidden;
  }
  .face i { width: 72%; height: 72%; margin: auto; border-radius: 50%; background: #000; visibility: hidden; }
  .face i.on { visibility: visible; }

  #resultat { font-size: 1.5rem; font-weight: bold; min-height: 2.4rem; margin: 0.8rem 0; }
</style>
</head>
<body>
<main>
  <h1>Essai des dés</h1>
  <p class="discret">Lance les dés pour voir et entendre l'animation. Sur iPhone, coupe le mode silencieux pour avoir le son.</p>

  <div id="tapis" aria-hidden="true"></div>

  <p id="resultat" role="status" aria-live="polite"></p>

  <div class="boutons">
    <button type="button" data-nombre="1">Lancer 1 dé</button>
    <button type="button" data-nombre="2">Lancer 2 dés</button>
    <button type="button" data-nombre="3">Lancer 3 dés</button>
    <button type="button" data-nombre="6">Lancer 6 dés</button>
  </div>

  <p class="discret"><a href="combats.html">Retour à l'essai des combats</a></p>
</main>

<script>
(function () {
  'use strict';

  var DUREE = 1500;          // durée d'un lancer, en millisecondes
  var REBONDS = 3;           // nombre de rebonds sur la table
  var tapis = document.getElementById('tapis');
  var zoneResultat = document.getElementById('resultat');
  var boutons = document.querySelectorAll('[data-nombre]');
  var calme = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function entre(a, b) { return a + Math.random() * (b - a); }
  function de6() { return 1 + Math.floor(Math.random() * 6); }

  // ---------------------------------------------------------------------
  // CONSTRUCTION D'UN DÉ EN 3D
  // ---------------------------------------------------------------------
  // Faces opposées : 1-6, 2-5, 3-4. Points allumés dans la grille 3 × 3 (cases 0 à 8).
  var POINTS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  // Position de chaque face sur le cube, et rotation qui l'amène face au joueur.
  var FACES = [
    { valeur: 1, place: function (d) { return 'translateZ(' + d + 'px)'; }, vers: [0, 0] },
    { valeur: 6, place: function (d) { return 'rotateY(180deg) translateZ(' + d + 'px)'; }, vers: [0, 180] },
    { valeur: 3, place: function (d) { return 'rotateY(90deg) translateZ(' + d + 'px)'; }, vers: [0, -90] },
    { valeur: 4, place: function (d) { return 'rotateY(-90deg) translateZ(' + d + 'px)'; }, vers: [0, 90] },
    { valeur: 2, place: function (d) { return 'rotateX(90deg) translateZ(' + d + 'px)'; }, vers: [-90, 0] },
    { valeur: 5, place: function (d) { return 'rotateX(-90deg) translateZ(' + d + 'px)'; }, vers: [90, 0] }
  ];
  var ORIENTATION = {};
  FACES.forEach(function (f) { ORIENTATION[f.valeur] = f.vers; });

  function fabriquerDe(taille) {
    var emplacement = document.createElement('div');
    emplacement.className = 'emplacement';
    // Même taille que le dé : il tourne autour de son centre, pas de son coin.
    emplacement.style.width = emplacement.style.height = taille + 'px';
    var ombre = document.createElement('div');
    ombre.className = 'ombre';
    ombre.style.width = ombre.style.height = (taille * 1.5) + 'px';
    var de = document.createElement('div');
    de.className = 'de';
    de.style.width = de.style.height = taille + 'px';
    FACES.forEach(function (f) {
      var face = document.createElement('div');
      face.className = 'face';
      face.style.width = face.style.height = taille + 'px';
      face.style.transform = f.place(taille / 2);
      for (var i = 0; i < 9; i += 1) {
        var point = document.createElement('i');
        if (POINTS[f.valeur].indexOf(i) >= 0) { point.className = 'on'; }
        face.appendChild(point);
      }
      de.appendChild(face);
    });
    emplacement.appendChild(de);
    tapis.appendChild(ombre);
    tapis.appendChild(emplacement);
    return { emplacement: emplacement, ombre: ombre, de: de };
  }

  // ---------------------------------------------------------------------
  // SON : chocs secs sur le bois, fabriqués par le programme
  // ---------------------------------------------------------------------
  var audio = null;
  var bruit = null;

  function preparerAudio() {
    if (audio) { return true; }
    var Contexte = window.AudioContext || window.webkitAudioContext;
    if (!Contexte) { return false; }
    audio = new Contexte();
    // Une seconde de bruit blanc, réutilisée pour chaque choc.
    bruit = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    var donnees = bruit.getChannelData(0);
    for (var i = 0; i < donnees.length; i += 1) { donnees[i] = Math.random() * 2 - 1; }
    return true;
  }

  // Un choc : bruit filtré très court, plus grave et plus fort pour un rebond,
  // plus aigu et plus léger quand le dé roule. pan : -1 (gauche) à 1 (droite).
  function choc(instant, force, pan) {
    var source = audio.createBufferSource();
    source.buffer = bruit;
    var filtre = audio.createBiquadFilter();
    filtre.type = 'bandpass';
    filtre.frequency.value = entre(1800, 3200) - force * 900;
    filtre.Q.value = entre(4, 8);
    var volume = audio.createGain();
    var duree = 0.03 + force * 0.05;
    volume.gain.setValueAtTime(0.0001, instant);
    volume.gain.exponentialRampToValueAtTime(0.15 + force * 0.85, instant + 0.003);
    volume.gain.exponentialRampToValueAtTime(0.0001, instant + duree);
    source.connect(filtre);
    filtre.connect(volume);
    var sortie = volume;
    if (audio.createStereoPanner) {
      var panneau = audio.createStereoPanner();
      panneau.pan.value = Math.max(-1, Math.min(1, pan));
      volume.connect(panneau);
      sortie = panneau;
    }
    sortie.connect(audio.destination);
    source.start(instant, entre(0, 0.9), duree + 0.02);
  }

  // Programme tous les chocs d'un dé, calés sur ses rebonds (voir hauteur()).
  function programmerSon(debut, duree, pan) {
    for (var k = 1; k <= REBONDS; k += 1) {
      var t = k / (REBONDS + 1);
      choc(debut + t * duree + entre(0, 0.01), 1 - t * 0.7, pan);
    }
    // Le dé roule après le dernier rebond : petits chocs de plus en plus espacés.
    var instant = REBONDS / (REBONDS + 1);
    var pas = 0.035;
    while (instant < 0.97) {
      instant += pas;
      pas *= 1.35;
      choc(debut + instant * duree, 0.25 * (1 - instant), pan);
    }
  }

  // ---------------------------------------------------------------------
  // MOUVEMENT
  // ---------------------------------------------------------------------
  function ralenti(p) { return 1 - Math.pow(1 - p, 3); }

  // Hauteur au-dessus de la table : des rebonds de plus en plus petits,
  // puis le dé reste posé et roule jusqu'à l'arrêt.
  function hauteur(p) {
    var fin = REBONDS / (REBONDS + 1);
    if (p >= fin) { return 0; }
    var phase = p * (REBONDS + 1);
    var k = Math.floor(phase);
    return Math.sin((phase - k) * Math.PI) * Math.pow(0.45, k);
  }

  function lancer(nombre) {
    if (!preparerAudio()) { /* pas de son, l'animation suffit */ }
    if (audio && audio.state === 'suspended') { audio.resume(); }
    var valeurs = [];
    for (var i = 0; i < nombre; i += 1) { valeurs.push(de6()); }

    tapis.textContent = '';
    zoneResultat.textContent = '';
    boutons.forEach(function (b) { b.disabled = true; });

    var largeur = tapis.clientWidth;
    var haut = tapis.clientHeight;
    var taille = nombre > 3 ? Math.min(58, largeur / 5) : Math.min(76, largeur / 4);
    var parLigne = Math.min(nombre, 3);
    var lignes = Math.ceil(nombre / parLigne);

    var des = valeurs.map(function (valeur, i) {
      var colonne = i % parLigne;
      var ligne = Math.floor(i / parLigne);
      // Position d'arrivée : les dés se posent côte à côte, sans se chevaucher.
      var finX = largeur * (colonne + 0.5) / parLigne - taille / 2 + entre(-8, 8);
      var finY = haut * (ligne + 0.5) / lignes - taille / 2 + entre(-8, 8);
      var orientation = ORIENTATION[valeur];
      var tours = [Math.round(entre(2, 4)) * 360, Math.round(entre(2, 4)) * 360];
      return {
        objet: fabriquerDe(taille),
        valeur: valeur,
        depart: [-taille * 1.5 - entre(0, 60), entre(-taille, haut * 0.6)],
        fin: [finX, finY],
        rotX: orientation[0], rotY: orientation[1],
        toursX: tours[0] * (Math.random() < 0.5 ? -1 : 1),
        toursY: tours[1] * (Math.random() < 0.5 ? -1 : 1),
        rotZdepart: entre(-180, 180), rotZfin: entre(-18, 18),
        decalage: entre(0, 0.06)
      };
    });

    function placer(d, p) {
      var e = ralenti(p);
      var x = d.depart[0] + (d.fin[0] - d.depart[0]) * e;
      var y = d.depart[1] + (d.fin[1] - d.depart[1]) * e;
      var h = hauteur(p) * taille * 1.2;
      var reste = 1 - e;
      var rx = d.rotX + d.toursX * reste;
      var ry = d.rotY + d.toursY * reste;
      var rz = d.rotZfin + (d.rotZdepart - d.rotZfin) * reste;
      d.objet.emplacement.style.transform =
        'translate3d(' + x + 'px,' + (y - h) + 'px,' + (h * 0.6) + 'px) rotateZ(' + rz + 'deg) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
      d.objet.ombre.style.transform = 'translate(' + (x - taille * 0.25) + 'px,' + (y - taille * 0.1) + 'px) scale(' + (1 - h / (taille * 3)) + ')';
      d.objet.ombre.style.opacity = String(1 - h / (taille * 2));
    }

    function conclure() {
      des.forEach(function (d) { placer(d, 1); });
      var liste = valeurs.join(', ').replace(/, (\d)$/, ' et $1');
      var total = valeurs.reduce(function (a, b) { return a + b; }, 0);
      zoneResultat.textContent = nombre === 1 ? 'Tu as fait ' + liste + '.' : 'Tu as fait ' + liste + '. Total : ' + total + '.';
      boutons.forEach(function (b) { b.disabled = false; });
    }

    if (calme) {
      // Animations réduites : les dés apparaissent posés, avec un seul choc.
      if (audio) { choc(audio.currentTime + 0.01, 0.6, 0); }
      conclure();
      return;
    }

    if (audio) {
      var maintenant = audio.currentTime + 0.02;
      des.forEach(function (d) {
        programmerSon(maintenant + d.decalage * DUREE / 1000, (1 - d.decalage) * DUREE / 1000, (d.fin[0] + taille / 2) / largeur * 2 - 1);
      });
    }

    var debut = null;
    function image(instant) {
      if (debut === null) { debut = instant; }
      var ecoule = (instant - debut) / DUREE;
      des.forEach(function (d) {
        var p = Math.max(0, Math.min(1, (ecoule - d.decalage) / (1 - d.decalage)));
        placer(d, p);
      });
      if (ecoule < 1) { requestAnimationFrame(image); } else { conclure(); }
    }
    requestAnimationFrame(image);
  }

  boutons.forEach(function (b) {
    b.addEventListener('click', function () { lancer(parseInt(b.getAttribute('data-nombre'), 10)); });
  });
})();
</script>
</body>
</html>
