<!DOCTYPE html>
<html lang="fr" data-couleurs="blanc-sur-noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premier combat — essai</title>
<style>
  :root { --fond: #000; --encre: #fff; }
  [data-couleurs="noir-sur-blanc"] { --fond: #fff; --encre: #000; }
  [data-couleurs="jaune-sur-noir"] { --fond: #000; --encre: #ffdd00; }
  [data-couleurs="orange-sur-noir"] { --fond: #000; --encre: #ff8c00; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fond);
    color: var(--encre);
    font-family: Verdana, "DejaVu Sans", system-ui, sans-serif;
    font-size: 1.25rem;
    line-height: 1.45;
  }
  p { margin: 0; }
  #jeu {
    max-width: 40rem;
    min-height: 100%;
    margin: 0 auto;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  /* Jauges de points de vie */
  #jauges {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 1rem;
    font-weight: bold;
    border-bottom: 3px solid var(--encre);
    padding-bottom: 0.5rem;
  }
  .jauge { display: grid; grid-template-columns: 4.6rem 1fr auto; align-items: center; gap: 0.5rem; }
  .jauge[hidden] { display: none; }
  .jauge .valeur { text-align: right; white-space: nowrap; min-width: 5.6rem; }
  .barre { display: flex; gap: 2px; }
  .barre i { flex: 1; height: 1.15rem; border: 2px solid var(--encre); }
  .barre i.plein { background: var(--encre); }
  .jauge.touchee .barre { animation: clignote 0.18s steps(1) 4; }
  @keyframes clignote { 50% { opacity: 0; } }

  #image {
    display: block;
    width: min(60vw, 32vh, 18rem);
    height: min(60vw, 32vh, 18rem);
    margin: 0 auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #jeu.combat #image { width: min(32vw, 16vh, 10rem); height: min(32vw, 16vh, 10rem); }

  /* Table de combat : les dés et le calcul */
  #table { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  #table[hidden] { display: none; }
  .camp { border: 3px solid var(--encre); padding: 0.4rem 0.3rem; text-align: center; }
  .camp .titre { font-size: 1rem; font-weight: bold; }
  .camp .des { display: flex; justify-content: center; align-items: center; gap: 0.6rem; min-height: 4.2rem; }
  .camp .calcul { font-size: 1rem; min-height: 1.5rem; }
  .camp .total { font-size: 1.5rem; font-weight: bold; min-height: 2.3rem; padding: 0 0.3rem; }
  .camp.gagne { border-width: 7px; padding: calc(0.4rem - 4px) calc(0.3rem - 4px); }
  .camp.gagne .total { background: var(--encre); color: var(--fond); }
  #regle { grid-column: 1 / -1; font-size: 0.95rem; text-align: center; }

  .de {
    width: 3.2rem;
    height: 3.2rem;
    border: 4px solid var(--encre);
    background: var(--fond);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    padding: 5px;
  }
  .de i.point { background: var(--encre); }
  .de.plein { background: var(--encre); }
  .de.plein i.point { background: var(--fond); }
  .de.fige { animation: pose 0.25s ease-out; }
  @keyframes pose { from { transform: scale(1.3); } to { transform: scale(1); } }

  #texte { flex: 1; min-height: 5rem; }
  #texte p { margin: 0 0 0.6rem; padding-left: 0.6rem; border-left: 5px solid transparent; }
  #texte p:last-child { font-weight: bold; border-left-color: var(--encre); }
  #avis { font-size: 1rem; border: 3px dashed var(--encre); padding: 0.5rem; }
  #avis[hidden] { display: none; }

  button {
    font: inherit;
    font-weight: bold;
    color: var(--encre);
    background: var(--fond);
    border: 4px solid var(--encre);
    border-radius: 0;
    padding: 0.6rem;
    cursor: pointer;
  }
  button:focus, button:active { outline: none; color: var(--fond); background: var(--encre); }
  #choix { display: flex; flex-direction: column; gap: 0.6rem; }
  #choix button { min-height: 4.2rem; font-size: 1.4rem; }
  #outils { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  #outils button { min-height: 3rem; font-size: 1rem; border-width: 3px; padding: 0.3rem; }

  #accueil {
    position: fixed;
    inset: 0;
    width: 100%;
    border: 0;
    padding: 1.5rem;
    font-size: 1.3rem;
    font-weight: normal;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1rem;
  }
  #accueil:focus, #accueil:active { color: var(--encre); background: var(--fond); }
  #accueil strong { font-size: 1.8rem; }
  #accueil[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .de.fige, .jauge.touchee .barre { animation: none; }
  }
</style>
</head>
<body>
<main id="jeu">
  <div id="jauges">
    <div class="jauge" id="jauge-heros"><span class="nom">Toi</span><span class="barre"></span><span class="valeur"></span></div>
    <div class="jauge" id="jauge-monstre" hidden><span class="nom">Gobelin</span><span class="barre"></span><span class="valeur"></span></div>
    <p id="chance"></p>
  </div>
  <canvas id="image" width="100" height="100" role="img" aria-label="Illustration"></canvas>
  <div id="table" hidden>
    <div class="camp" id="camp-heros"><p class="titre">Toi</p><div class="des"></div><p class="calcul"></p><p class="total"></p></div>
    <div class="camp" id="camp-monstre"><p class="titre">Gobelin</p><div class="des"></div><p class="calcul"></p><p class="total"></p></div>
    <p id="regle">Chacun lance 2 dés et ajoute son habileté. Le plus haut total touche.</p>
  </div>
  <div id="texte"></div>
  <p id="avis" hidden></p>
  <div id="choix"></div>
  <div id="outils">
    <button id="repeter" type="button">Répéter</button>
    <button id="point" type="button">Où j'en suis</button>
    <button id="couleurs" type="button">Couleurs</button>
  </div>
</main>

<button id="accueil" type="button" autofocus>
  <strong>Premier combat</strong>
  <span>Un essai : une porte, une salle, un gobelin.</span>
  <span>Touche l'écran ou appuie sur Entrée pour commencer. Le jeu te parle : monte le son.</span>
  <span>Au clavier : flèches pour choisir, Entrée pour valider, R pour répéter, P pour savoir où tu en es, C pour les couleurs.</span>
</button>

<!-- ========================================================= -->
<!-- 1. MOTEUR : règles et état. Ne connaît ni l'écran ni le son. -->
<!-- ========================================================= -->
<script>
(function () {
  'use strict';

  var PERSONNAGE = { habilete: 7, vie: 12, desDeChance: 3, arme: 'epee-rouillee' };
  var OBJETS = {
    'epee-rouillee': { bonus: 0, degats: 2 },
    'dague': { bonus: 1, degats: 2 }
  };
  var MONSTRES = {
    gobelin: { habilete: 5, vie: 4, degats: 2, seuilFuite: 4, butin: 'dague' }
  };
  var SEUIL_CHANCE = 4;

  // Générateur de hasard reproductible : une même graine donne la même partie.
  function creerHasard(graine) {
    var a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function creerMoteur(graine) {
    var hasard = creerHasard(graine);
    var etat = null;

    function de() { return 1 + Math.floor(hasard() * 6); }

    function proposer() {
      var ids = Array.prototype.slice.call(arguments);
      etat.choix = ids.map(function (id) { return { id: id }; });
      return { type: 'choix-proposes', donnees: { choix: ids } };
    }

    function nouvellePartie() {
      etat = {
        version: 1,
        phase: 'exploration',
        graine: graine,
        heros: {
          habilete: PERSONNAGE.habilete,
          vie: PERSONNAGE.vie,
          vieMax: PERSONNAGE.vie,
          desDeChance: PERSONNAGE.desDeChance,
          arme: PERSONNAGE.arme
        },
        combat: null,
        chanceEnAttente: null,
        choix: []
      };
      return [
        { type: 'partie-commencee', donnees: { vie: etat.heros.vie, vieMax: etat.heros.vieMax, desDeChance: etat.heros.desDeChance } },
        proposer('ouvrir-porte')
      ];
    }

    function ouvrirPorte() {
      var id = 'gobelin';
      etat.phase = 'combat';
      etat.combat = { monstre: id, vieMonstre: MONSTRES[id].vie, tour: 1 };
      return [
        { type: 'porte-ouverte', donnees: {} },
        { type: 'salle-entree', donnees: { typeSalle: 'monstre' } },
        { type: 'monstre-apparait', donnees: { monstre: id, vieMonstre: MONSTRES[id].vie } },
        proposer('attaquer', 'fuir')
      ];
    }

    function finDeLEssai(issue) {
      etat.phase = 'fin';
      etat.combat = null;
      return [{ type: 'fin-essai', donnees: { issue: issue } }, proposer('nouvelle-partie')];
    }

    function tourSuivant() {
      etat.phase = 'combat';
      etat.chanceEnAttente = null;
      etat.combat.tour += 1;
      return [proposer('attaquer', 'fuir')];
    }

    // Le coup du monstre est réellement subi.
    function subir(degats, critique) {
      var h = etat.heros;
      h.vie = Math.max(0, h.vie - degats);
      etat.chanceEnAttente = null;
      var messages = [{
        type: 'assaut-resultat',
        donnees: {
          gagnant: 'monstre', degats: degats, critique: critique,
          vieHeros: h.vie, vieMonstre: etat.combat.vieMonstre
        }
      }];
      if (h.vie === 0) {
        etat.phase = 'mort';
        etat.combat = null;
        return messages.concat([{ type: 'heros-mort', donnees: {} }, proposer('nouvelle-partie')]);
      }
      return messages.concat(tourSuivant());
    }

    // Le monstre va frapper : on propose un dé de chance si la situation est critique.
    function coupDuMonstre(degats, critique, fuiteRatee) {
      var h = etat.heros;
      var situation = fuiteRatee ? 'fuite-ratee' : (h.vie - degats <= 0 ? 'coup-mortel' : null);
      if (situation && h.desDeChance > 0) {
        etat.phase = 'chance';
        etat.chanceEnAttente = { situation: situation, degats: degats, critique: critique };
        return [
          { type: 'chance-proposee', donnees: { situation: situation, desRestants: h.desDeChance } },
          proposer('tenter-sa-chance', 'renoncer')
        ];
      }
      return subir(degats, critique);
    }

    function attaquer() {
      var h = etat.heros;
      var c = etat.combat;
      var m = MONSTRES[c.monstre];
      var arme = OBJETS[h.arme];
      var dh = [de(), de()];
      var dm = [de(), de()];
      var bonusHeros = h.habilete + arme.bonus;
      var totalHeros = dh[0] + dh[1] + bonusHeros;
      var totalMonstre = dm[0] + dm[1] + m.habilete;
      var messages = [
        { type: 'des-lances', donnees: { qui: 'heros', des: dh, bonus: bonusHeros, total: totalHeros } },
        { type: 'des-lances', donnees: { qui: 'monstre', des: dm, bonus: m.habilete, total: totalMonstre } }
      ];
      if (totalHeros > totalMonstre) {
        var critique = dh[0] === 6 && dh[1] === 6;
        var degats = arme.degats * (critique ? 2 : 1);
        c.vieMonstre = Math.max(0, c.vieMonstre - degats);
        messages.push({
          type: 'assaut-resultat',
          donnees: {
            gagnant: 'heros', degats: degats, critique: critique,
            vieHeros: h.vie, vieMonstre: c.vieMonstre
          }
        });
        if (c.vieMonstre === 0) {
          etat.phase = 'butin';
          messages.push({ type: 'monstre-vaincu', donnees: { monstre: c.monstre } });
          messages.push({ type: 'butin-trouve', donnees: { genre: 'arme', objet: m.butin } });
          messages.push(proposer('prendre', 'laisser'));
          return messages;
        }
        return messages.concat(tourSuivant());
      }
      if (totalHeros === totalMonstre) {
        messages.push({
          type: 'assaut-resultat',
          donnees: {
            gagnant: 'egalite', degats: 0, critique: false,
            vieHeros: h.vie, vieMonstre: c.vieMonstre
          }
        });
        return messages.concat(tourSuivant());
      }
      var critiqueMonstre = dm[0] === 6 && dm[1] === 6;
      return messages.concat(coupDuMonstre(m.degats * (critiqueMonstre ? 2 : 1), critiqueMonstre, false));
    }

    function fuir() {
      var m = MONSTRES[etat.combat.monstre];
      var resultat = de();
      var reussie = resultat >= m.seuilFuite;
      var messages = [{ type: 'fuite-resultat', donnees: { de: resultat, seuil: m.seuilFuite, reussie: reussie } }];
      if (reussie) { return messages.concat(finDeLEssai('fuite')); }
      return messages.concat(coupDuMonstre(m.degats, false, true));
    }

    function tenterSaChance() {
      var h = etat.heros;
      var attente = etat.chanceEnAttente;
      var resultat = de();
      var reussie = resultat >= SEUIL_CHANCE;
      h.desDeChance -= 1;
      var messages = [{
        type: 'chance-resultat',
        donnees: { de: resultat, seuil: SEUIL_CHANCE, reussie: reussie, desRestants: h.desDeChance, situation: attente.situation }
      }];
      if (reussie) { return messages.concat(tourSuivant()); }
      return messages.concat(subir(attente.degats, attente.critique));
    }

    function renoncer() {
      var attente = etat.chanceEnAttente;
      return subir(attente.degats, attente.critique);
    }

    function prendre() {
      var objet = MONSTRES[etat.combat.monstre].butin;
      etat.heros.arme = objet;
      var habilete = etat.heros.habilete + OBJETS[objet].bonus;
      return [{ type: 'butin-pris', donnees: { objet: objet, habilete: habilete } }].concat(finDeLEssai('victoire'));
    }

    function laisser() {
      return [{ type: 'butin-laisse', donnees: {} }].concat(finDeLEssai('victoire'));
    }

    function faireLePoint() {
      if (!etat) { return []; }
      var h = etat.heros;
      var messages = [{
        type: 'etat-heros',
        donnees: { vie: h.vie, vieMax: h.vieMax, desDeChance: h.desDeChance, arme: h.arme }
      }];
      if (etat.combat && etat.combat.vieMonstre > 0) {
        messages.push({ type: 'etat-combat', donnees: { monstre: etat.combat.monstre, vieMonstre: etat.combat.vieMonstre } });
      }
      messages.push({ type: 'choix-proposes', donnees: { choix: etat.choix.map(function (c) { return c.id; }) } });
      return messages;
    }

    var ACTIONS = {
      'ouvrir-porte': ouvrirPorte,
      'attaquer': attaquer,
      'fuir': fuir,
      'tenter-sa-chance': tenterSaChance,
      'renoncer': renoncer,
      'prendre': prendre,
      'laisser': laisser,
      'nouvelle-partie': nouvellePartie
    };

    function executer(commande) {
      if (commande.type === 'nouvelle-partie') { return nouvellePartie(); }
      if (commande.type === 'faire-le-point') { return faireLePoint(); }
      if (commande.type === 'choisir' && etat) {
        var permis = etat.choix.some(function (c) { return c.id === commande.id; });
        if (permis && ACTIONS[commande.id]) { return ACTIONS[commande.id](); }
      }
      return [];
    }

    return { executer: executer, etat: function () { return etat; } };
  }

  window.MOTEUR = { creerMoteur: creerMoteur };
})();
</script>

<!-- ========================================================= -->
<!-- 2. TEXTES : toutes les phrases du jeu, dites et affichées.   -->
<!--    Chaque phrase a un identifiant et un enregistrement.     -->
<!-- ========================================================= -->
<script id="textes">
(function () {
  'use strict';
  var t = {};
  var n;
  function pv(k) { return k + (k > 1 ? ' points de vie' : ' point de vie'); }

  t['intro'] = 'Le froid monte des dalles. Devant toi, une porte de chêne cloutée de fer. Derrière, quelque chose gratte la pierre.';
  t['porte-ouverte'] = 'Tu pousses le battant. Les gonds hurlent.';
  t['salle-entree'] = 'Une salle basse, sous une voûte noircie. Au mur, une torche agonise.';
  t['gobelin-apparait'] = 'Dans l\'ombre, deux yeux s\'allument. Un gobelin bondit, un hachoir ébréché au poing.';
  t['regle-combat'] = 'Le combat : chacun lance deux dés et ajoute son habileté. Le plus haut total touche l\'autre.';

  for (n = 9; n <= 20; n += 1) { t['tu-fais-' + n] = 'Tu fais ' + n + '.'; }
  for (n = 7; n <= 17; n += 1) { t['gobelin-fait-' + n] = 'Le gobelin, ' + n + '.'; }
  t['egalite'] = 'Égalité. Les lames s\'entrechoquent.';
  t['double-six-heros'] = 'Double six, dégâts doublés !';
  t['double-six-gobelin'] = 'Double six pour le gobelin !';
  t['coup-heros-1'] = 'Ta lame trouve la chair.';
  t['coup-heros-2'] = 'Tu frappes à l\'épaule.';
  t['coup-heros-3'] = 'Ton coup porte.';
  t['coup-gobelin-1'] = 'Le hachoir t\'entaille le bras.';
  t['coup-gobelin-2'] = 'Le gobelin te frappe au flanc.';
  t['coup-gobelin-3'] = 'Tu n\'esquives pas assez vite.';
  for (n = 1; n <= 3; n += 1) { t['gobelin-reste-' + n] = 'Il reste ' + pv(n) + ' au gobelin.'; }
  for (n = 1; n <= 11; n += 1) { t['heros-reste-' + n] = 'Il te reste ' + pv(n) + '.'; }

  for (n = 1; n <= 6; n += 1) { t['fuite-de-' + n] = 'Tu tentes de fuir : ' + n + '.'; }
  for (n = 3; n <= 5; n += 1) { t['il-fallait-' + n] = 'Il fallait ' + n + ' ou plus.'; }
  t['fuite-reussie'] = 'Tu recules d\'un bond et claques la porte derrière toi.';
  t['fuite-ratee'] = 'Le gobelin te barre le passage.';

  t['chance-coup-mortel'] = 'Ce coup serait le dernier.';
  t['chance-fuite-ratee'] = 'Le coup va tomber.';
  t['chance-reste-0'] = 'Il ne te reste aucun dé de chance.';
  t['chance-reste-1'] = 'Il te reste 1 dé de chance.';
  t['chance-reste-2'] = 'Il te reste 2 dés de chance.';
  t['chance-reste-3'] = 'Il te reste 3 dés de chance.';
  for (n = 1; n <= 6; n += 1) { t['chance-de-' + n] = 'Dé de chance : ' + n + '.'; }
  t['chance-reussie'] = 'Le hachoir siffle à un cheveu de ta gorge.';
  t['chance-perdue'] = 'La chance t\'abandonne.';

  t['gobelin-vaincu'] = 'Le gobelin s\'effondre dans un dernier couinement. Le silence retombe.';
  t['butin-dague'] = 'À sa ceinture, une dague à la lame encore nette. Elle te donnerait plus un en habileté.';
  t['butin-pris'] = 'Tu glisses la dague à ta ceinture. Ton habileté passe à 8.';
  t['butin-laisse'] = 'Tu laisses la dague où elle est.';
  t['mort'] = 'Tes jambes cèdent. Le noir se referme sur toi.';
  t['fin-essai'] = 'Fin de cet essai.';

  for (n = 0; n <= 12; n += 1) { t['point-vie-' + n] = 'Il te reste ' + pv(n) + ' sur 12.'; }
  t['point-arme-epee-rouillee'] = 'Tu es armé d\'une épée rouillée.';
  t['point-arme-dague'] = 'Tu es armé d\'une dague.';
  for (n = 1; n <= 4; n += 1) { t['gobelin-encore-' + n] = 'Le gobelin a encore ' + pv(n) + '.'; }

  t['choix-ouvrir-porte'] = 'Tu peux ouvrir la porte.';
  t['choix-attaquer-fuir'] = 'Tu peux attaquer, ou fuir.';
  t['choix-tenter-sa-chance-renoncer'] = 'Tu peux tenter ta chance, ou renoncer.';
  t['choix-prendre-laisser'] = 'Tu peux prendre la dague, ou la laisser.';
  t['choix-nouvelle-partie'] = 'Tu peux rejouer.';

  t['libelle-ouvrir-porte'] = 'Ouvrir la porte.';
  t['libelle-attaquer'] = 'Attaquer.';
  t['libelle-fuir'] = 'Fuir.';
  t['libelle-tenter-sa-chance'] = 'Tenter ma chance.';
  t['libelle-renoncer'] = 'Renoncer.';
  t['libelle-prendre'] = 'Prendre la dague.';
  t['libelle-laisser'] = 'La laisser.';
  t['libelle-nouvelle-partie'] = 'Rejouer.';

  t['couleur-blanc-sur-noir'] = 'Blanc sur noir.';
  t['couleur-noir-sur-blanc'] = 'Noir sur blanc.';
  t['couleur-jaune-sur-noir'] = 'Jaune sur noir.';
  t['couleur-orange-sur-noir'] = 'Orange sur noir.';

  var tirage = 0;
  function variante(prefixe) { tirage += 1; return prefixe + (1 + tirage % 3); }

  // Les deux lancers d'un assaut sont montrés ensemble, pour un combat plus rapide.
  function regrouper(messages) {
    var scenes = [];
    for (var i = 0; i < messages.length; i += 1) {
      var m = messages[i];
      var suivant = messages[i + 1];
      if (m.type === 'des-lances' && suivant && suivant.type === 'des-lances') {
        scenes.push({ type: 'assaut-des', donnees: { heros: m.donnees, monstre: suivant.donnees } });
        i += 1;
      } else {
        scenes.push(m);
      }
    }
    return scenes;
  }

  // Chaque message du moteur devient une suite de phrases, désignées par leur identifiant.
  function phrasesDe(message) {
    var d = message.donnees;
    var suite = [];
    switch (message.type) {
      case 'partie-commencee': return ['intro'];
      case 'porte-ouverte': return ['porte-ouverte'];
      case 'salle-entree': return ['salle-entree'];
      case 'monstre-apparait': return ['gobelin-apparait'];
      case 'assaut-des': return ['tu-fais-' + d.heros.total, 'gobelin-fait-' + d.monstre.total];
      case 'assaut-resultat':
        if (d.gagnant === 'egalite') { return ['egalite']; }
        if (d.gagnant === 'heros') {
          if (d.critique) { suite.push('double-six-heros'); }
          suite.push(variante('coup-heros-'));
          if (d.vieMonstre > 0) { suite.push('gobelin-reste-' + d.vieMonstre); }
          return suite;
        }
        if (d.critique) { suite.push('double-six-gobelin'); }
        suite.push(variante('coup-gobelin-'));
        if (d.vieHeros > 0) { suite.push('heros-reste-' + d.vieHeros); }
        return suite;
      case 'fuite-resultat':
        return ['fuite-de-' + d.de, 'il-fallait-' + d.seuil, d.reussie ? 'fuite-reussie' : 'fuite-ratee'];
      case 'chance-proposee':
        return [d.situation === 'coup-mortel' ? 'chance-coup-mortel' : 'chance-fuite-ratee', 'chance-reste-' + d.desRestants];
      case 'chance-resultat':
        return ['chance-de-' + d.de, 'il-fallait-' + d.seuil, d.reussie ? 'chance-reussie' : 'chance-perdue'];
      case 'monstre-vaincu': return ['gobelin-vaincu'];
      case 'butin-trouve': return ['butin-dague'];
      case 'butin-pris': return ['butin-pris'];
      case 'butin-laisse': return ['butin-laisse'];
      case 'heros-mort': return ['mort'];
      case 'fin-essai': return ['fin-essai'];
      case 'etat-heros': return ['point-vie-' + d.vie, 'chance-reste-' + d.desDeChance, 'point-arme-' + d.arme];
      case 'etat-combat': return ['gobelin-encore-' + d.vieMonstre];
      case 'choix-proposes': return ['choix-' + d.choix.join('-')];
    }
    return [];
  }

  window.TEXTES = t;
  window.PHRASES = { phrasesDe: phrasesDe, regrouper: regrouper };
})();

    var p = document.createElement('p');

  function remplirJauge(jauge, valeur, maximum) {
    var barre = jauge.querySelector('.barre');
    barre.textContent = '';
    for (var i = 0; i < maximum; i += 1) {
      var segment = document.createElement('i');
      if (i < valeur) { segment.className = 'plein'; }
      barre.appendChild(segment);
    }
    jauge.querySelector('.valeur').textContent = valeur + ' sur ' + maximum;
  }

  function afficherJauges() {
    remplirJauge(jaugeHeros, vue.vie, vue.vieMax);

  function secouer(jauge) {

  function creerDe(plein) {
    var d = document.createElement('div');
    d.className = plein ? 'de plein' : 'de';
    for (var i = 0; i < 9; i += 1) { d.appendChild(document.createElement('i')); }
    return d;
  }

  function montrerFace(d, valeur) {
    var pointsDeLaFace = FACES[valeur];
    for (var i = 0; i < 9; i += 1) {
      d.children[i].className = pointsDeLaFace.indexOf(i) === -1 ? '' : 'point';
    }
  }

  function viderCamp(camp, titre) {
    camp.classList.remove('gagne');
    camp.querySelector('.titre').textContent = titre;
    camp.querySelector('.des').textContent = '';
    camp.querySelector('.calcul').textContent = '';
    camp.querySelector('.total').textContent = '';
  }

  function viderTable() {
    viderCamp(campHeros, 'Toi');
    viderCamp(campMonstre, 'Gobelin');

  function entre(a, b) { return a + Math.random() * (b - a); }

  // Les dés roulent, puis se figent sur leur résultat.
  async function roulerDes(lancers, monTour) {
    jouerSon('des');
    if (!mouvementReduit) {
      var fin = Date.now() + 900;
      while (Date.now() < fin && monTour === tour) {
        lancers.forEach(function (l) {
          montrerFace(l.de, 1 + Math.floor(Math.random() * 6));
          l.de.style.transform = 'translate(' + entre(-8, 8) + 'px,' + entre(-8, 8) + 'px) rotate(' + entre(-35, 35) + 'deg)';
        });
        await pause(70);
      }
    }
    lancers.forEach(function (l) {
      montrerFace(l.de, l.valeur);
      l.de.style.transform = '';
      l.de.classList.add('fige');
    });
    await pause(350);
  }

  async function jouerAssaut(heros, monstre, monTour) {
    viderTable();
    var lancers = [];
    [[campHeros, heros, true], [campMonstre, monstre, false]].forEach(function (c) {
      c[1].des.forEach(function (valeur) {
        var d = creerDe(c[2]);
        c[0].querySelector('.des').appendChild(d);
        lancers.push({ de: d, valeur: valeur });
      });
    });
    await roulerDes(lancers, monTour);
    [[campHeros, heros], [campMonstre, monstre]].forEach(function (c) {
      c[0].querySelector('.calcul').textContent = (c[1].des[0] + c[1].des[1]) + ' + ' + c[1].bonus + ' d\'habileté';
      c[0].querySelector('.total').textContent = '= ' + c[1].total;
    });
  }

  async function jouerJetSimple(titre, valeur, seuil, reussi, monTour) {
    viderTable();
    campHeros.querySelector('.titre').textContent = titre;
    campMonstre.querySelector('.titre').textContent = 'Il faut';
    campMonstre.querySelector('.calcul').textContent = seuil + ' ou plus';
    var d = creerDe(true);
    campHeros.querySelector('.des').appendChild(d);
    await roulerDes([{ de: d, valeur: valeur }], monTour);
    campHeros.querySelector('.total').textContent = '= ' + valeur;
    campMonstre.querySelector('.total').textContent = reussi ? 'Réussi' : 'Raté';
    if (reussi) { campHeros.classList.add('gagne'); } else { campMonstre.classList.add('gagne'); }

  async function mettreEnScene(m, monTour) {

    switch (m.type) {
      case 'partie-commencee':
        fermerTable();
        vue = { vie: d.vie, vieMax: d.vieMax, chance: d.desDeChance, vieMonstre: 0, vieMonstreMax: 0 };
        afficherJauges();
        break;
      case 'porte-ouverte':
        sons = ['porte'];
        break;
      case 'monstre-apparait':
        sons = ['cri'];
        vue.vieMonstre = d.vieMonstre;
        vue.vieMonstreMax = d.vieMonstre;
        afficherJauges();
        ouvrirTable();
        break;
      case 'assaut-des':
        await jouerAssaut(d.heros, d.monstre, monTour);
        break;
      case 'assaut-resultat':
        if (d.gagnant === 'heros') {
          sons = [d.critique ? 'critique' : 'coup'];
          campHeros.classList.add('gagne');
          secouer(jaugeMonstre);
        } else if (d.gagnant === 'monstre') {
          sons = ['blessure'];
          campMonstre.classList.add('gagne');
          secouer(jaugeHeros);
        } else {
          sons = ['choc'];
        }
        vue.vie = d.vieHeros;
        vue.vieMonstre = d.vieMonstre;
        afficherJauges();
        break;
      case 'fuite-resultat':
        await jouerJetSimple('Fuite', d.de, d.seuil, d.reussie, monTour);
        if (d.reussie) { sons = ['fuite']; }
        break;
      case 'chance-proposee':
        vue.chance = d.desRestants;
        afficherJauges();
        break;
      case 'chance-resultat':
        await jouerJetSimple('Chance', d.de, d.seuil, d.reussie, monTour);
        sons = [d.reussie ? 'chanceOui' : 'chanceNon'];
        vue.chance = d.desRestants;
        afficherJauges();
        break;
      case 'monstre-vaincu':
        sons = ['victoire'];
        break;
      case 'butin-trouve':
        sons = ['butin'];
        fermerTable();
        vue.vieMonstreMax = 0;
        afficherJauges();
        break;
      case 'heros-mort':
        sons = ['mort'];
        fermerTable();
        break;
      case 'fin-essai':
        fermerTable();
        vue.vieMonstreMax = 0;
        afficherJauges();
        break;
    }
    for (var s = 0; s < sons.length; s += 1) {
      if (monTour !== tour) { return; }
      var duree = jouerSon(sons[s]);
      if (duree) { await pause(duree * 1000); }
    }
  }

  var moteur = window.MOTEUR.creerMoteur(Date.now());

  async function rendre(messages) {
    tour += 1;
    var monTour = tour;
    taire();
    await pause(60);
    if (monTour !== tour) { return; }
    zoneTexte.textContent = '';
    dernieresPhrases = [];
    var scenes = window.PHRASES.regrouper(messages);
    for (var i = 0; i < scenes.length; i += 1) {
      var m = scenes[i];
      if (m.type === 'choix-proposes') { afficherChoix(m.donnees.choix); }
      if (Object.prototype.hasOwnProperty.call(IMAGE_PAR_MESSAGE, m.type)) { montrer(IMAGE_PAR_MESSAGE[m.type]); }
      await mettreEnScene(m, monTour);
      if (monTour !== tour) { return; }
      var ids = phrasesDe(m);
      if (m.type === 'monstre-apparait' && !regleExpliquee) {
        regleExpliquee = true;
        ids.push('regle-combat');
      }
      if (m.type === 'choix-proposes') {
        // Les choix ne sont redits que lorsqu'ils changent.
        var cle = m.donnees.choix.join(',');
        if (cle === choixAnnonces) { continue; }
        choixAnnonces = cle;
      } else if (ids.length) {
        ecrire(ids.map(lire).join(' '));
      }
      for (var p = 0; p < ids.length; p += 1) {
        dernieresPhrases.push(ids[p]);
        await dire(ids[p]);
        if (monTour !== tour) { return; }
      }
    }
  }

    zoneChoix.textContent = '';

      await dire(phrases[i]);

      position = position === -1 ? (sens === 1 ? 0 : boutons.length - 1) : (position + sens + boutons.length) % boutons.length;
      boutons[position].focus();
      jouerSon('bip');
      redire(['libelle-' + boutons[position].getAttribute('data-id')]);
      return;
    }
    if (touche === 'Enter' && boutons.indexOf(document.activeElement) === -1 && boutons.length) {
      evenement.preventDefault();
      boutons[0].focus();
      jouerSon('bip');
      redire(['libelle-' + boutons[0].getAttribute('data-id')]);
      return;
    }
    if (touche === 'r' || touche === 'R') { document.getElementById('repeter').click(); }
    if (touche === 'p' || touche === 'P') { document.getElementById('point').click(); }
    if (touche === 'c' || touche === 'C') { document.getElementById('couleurs').click(); }
  });

  appliquerCouleurs();
  chargerPaquet();
  montrer('porte');
  accueil.focus();
})();
</script>
